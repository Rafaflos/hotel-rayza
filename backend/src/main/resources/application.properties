spring.application.name=hotel-backend

# Credenciales y tokens: se cargan desde backend/secrets.properties
# (NO versionado — ver secrets.properties.example)
spring.config.import=optional:file:./secrets.properties,optional:file:./backend/secrets.properties


# ============================================================
# MYSQL
# ============================================================

spring.datasource.url=jdbc:mysql://localhost:3306/hotel_management?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ============================================================
# SERVER
# ============================================================

server.port=8081


# ============================================================
# JWT
# ============================================================

# Secreto de firma de los tokens. Trae un valor por defecto para que la app
# empaquetada (una sola PC) funcione sin configuración; se puede sobreescribir
# con la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET:c2VjcmV0LWRlLXByb2R1Y2Npb24tY2FyaXRhLWhvdGVsLWNhbWJpYXItc2ktc2UtcXVpZXJl}

jwt.expiration-ms=86400000


# ============================================================
# CORS
# ============================================================
# Incluye los orígenes de la webview de Tauri (tauri.localhost en Windows/Linux)
# además de los puertos de desarrollo. Sobreescribible con APP_CORS_ALLOWED_ORIGINS.

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5199,tauri://localhost,http://tauri.localhost,https://tauri.localhost}


# ============================================================
# NUBEFACT (facturación electrónica SUNAT)
# Cuenta de PRODUCCIÓN real — ruta y token vienen de variables de entorno
# (NUBEFACT_URL / NUBEFACT_TOKEN) o de backend/secrets.properties en desarrollo.
# ============================================================

nubefact.url=${NUBEFACT_URL:}

nubefact.token=${NUBEFACT_TOKEN:}

nubefact.serie.factura=FFH1

nubefact.serie.boleta=BBH1

# Encender la facturación electrónica real con la variable NUBEFACT_ENABLED=true
nubefact.enabled=${NUBEFACT_ENABLED:false}
