name: Build Windows Installer

# Compila y firma el instalador de Windows (.msi / .exe) de Hotel Rayza y publica
# un GitHub Release con los artefactos de actualización (para el auto-updater).
# Se ejecuta al crear un tag "v*" (ej. v1.0.0) o manualmente desde Actions.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Necesario para que la acción pueda crear el Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17 (para compilar el backend)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "Carita Hotel/src-tauri -> target"

      - name: Instalar dependencias del frontend
        working-directory: "Carita Hotel"
        run: npm ci

      - name: Compilar, firmar y publicar el Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Llaves de firma del updater (configurar en Settings > Secrets del repo)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "Carita Hotel"
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'app-v__VERSION__' }}
          releaseName: "Hotel Rayza v__VERSION__"
          releaseBody: "Nueva versión de Hotel Rayza. La app se actualizará sola al abrirla."
          releaseDraft: false
          prerelease: false
