name: Build Windows Installer

# Compila el instalador de Windows (.msi / .exe) de Hotel Rayza.
# Se ejecuta al crear un tag "v*" (ej. v1.0.0) o manualmente desde la pestaña Actions.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17 (para compilar el backend)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "Carita Hotel/src-tauri -> target"

      - name: Instalar dependencias del frontend
        working-directory: "Carita Hotel"
        run: npm ci

      - name: Compilar el instalador (Tauri)
        working-directory: "Carita Hotel"
        run: npm run tauri build

      - name: Publicar el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: hotel-rayza-windows
          path: |
            Carita Hotel/src-tauri/target/release/bundle/msi/*.msi
            Carita Hotel/src-tauri/target/release/bundle/nsis/*.exe
